# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Academic Paper LangGraph chatbot regression evaluation

prompts:
  - "{{query}}"

providers:
  - id: file://provider.py
    label: academic-paper-langgraph

defaultTest:
  threshold: 0.6
  assert:
    - type: python
      value: file://assertions.py:response_quality
      metric: response_quality

tests:
  - file://tests.py:generate_tests
