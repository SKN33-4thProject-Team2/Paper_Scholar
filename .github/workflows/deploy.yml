name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Docker Hub 로그인 (paperscholar 조직 권한이 있는 PAT 사용)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Docker 이미지 빌드 및 paperscholar 조직 저장소로 푸시
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/paper-scholar-backend:latest

      # 3. [완전 자동화] SSH 서버 접속 및 최신 도커 컨테이너 재적재
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 서버 내 프로젝트 경로 자동 이동 (Ubuntu/Root 표준 경로 대응)
            cd /home/${{ secrets.SERVER_USER }}/Paper_Scholar || cd /root/Paper_Scholar || cd ~/Paper_Scholar
            
            # 최신 이미지 끌어오기 & 기존 컨테이너 교체
            docker pull ${{ secrets.DOCKER_USERNAME }}/paper-scholar-backend:latest
            docker compose down || true
            docker compose up -d
            
            # 미사용 구버전 이미지 정리
            docker image prune -f