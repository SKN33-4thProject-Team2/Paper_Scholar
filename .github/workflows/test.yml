name: API, graph and frontend tests
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: test-only-secret-key-with-at-least-thirty-two-characters
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python manage.py test scholar --settings=django_config.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=django_config.test_settings
      - run: python -m unittest tests.test_search_intent tests.test_orchestration tests.test_translation_markdown_service tests.test_deploy_backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && node --test tests/*.test.js && npm run build
        working-directory: frontend
