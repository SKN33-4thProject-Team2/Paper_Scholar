services:
  backend:
    build:
      context: .                # 최상단 폴더(Paper_Scholar)
      dockerfile: Dockerfile    # 최상단에 위치한 Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app                  # 코드 실시간 반영
    environment:
      - DEBUG=1