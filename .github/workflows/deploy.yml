name: Deploy to EC2 with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 타임아웃 제한 시간을 40분으로 확장하여 빌드 중단 방지
          timeout: 40m
          command_timeout: 40m
          script: |
            # 1. 소스코드 최신화
            if [ -d "/home/ubuntu/Paper_Scholar" ]; then
              cd /home/ubuntu/Paper_Scholar
              git pull origin main
            else
              cd /home/ubuntu
              git clone https://github.com/${{ github.repository }}.git
              cd Paper_Scholar
            fi

            # 2. 잔여 빌드 캐시 정리
            docker builder prune -f

            # 3. 도커 이미지 빌드
            docker build -t lizcha01/paper-scholar:latest .

            # 4. 기존 컨테이너 교체
            docker stop paper-scholar || true
            docker rm paper-scholar || true

            # 5. 백그라운드 구동
            docker run -d \
              --name paper-scholar \
              -p 8000:8000 \
              --restart always \
              -e DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              lizcha01/paper-scholar:latest