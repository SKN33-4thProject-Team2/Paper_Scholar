name: Deploy to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: "배포할 영역"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - backend

# 같은 운영 서버를 동시에 수정하지 않도록 배포를 직렬화한다.
concurrency:
  group: paper-scholar-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: 변경 영역 감지
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 배포 대상 결정
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          backend=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$MANUAL_TARGET" in
              all)
                frontend=true
                backend=true
                ;;
              frontend)
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              *)
                echo "알 수 없는 수동 배포 대상: $MANUAL_TARGET" >&2
                exit 1
                ;;
            esac
          elif [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            # 비교 기준이 없는 최초 push는 안전하게 전체 배포한다.
            frontend=true
            backend=true
          else
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE_SHA" || true
            fi

            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "이전 커밋을 확인할 수 없어 안전하게 전체 배포합니다."
              frontend=true
              backend=true
            else
              while IFS= read -r file; do
                [[ -z "$file" ]] && continue
                echo "변경: $file"

                case "$file" in
                  frontend/*)
                    frontend=true
                    ;;
                  backend/*|src/*|log/*|requirements.txt|Dockerfile|.dockerignore)
                    backend=true
                    ;;
                  .github/workflows/deploy.yml)
                    # 배포 로직 자체가 바뀌면 양쪽을 모두 검증한다.
                    frontend=true
                    backend=true
                    ;;
                esac
              done < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
            fi
          fi

          echo "frontend=$frontend" | tee -a "$GITHUB_OUTPUT"
          echo "backend=$backend" | tee -a "$GITHUB_OUTPUT"

  deploy-frontend:
    name: 프론트엔드 배포
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 의존성 캐시
        id: frontend-deps
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: 프론트엔드 의존성 설치
        if: steps.frontend-deps.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: 프론트엔드 빌드
        working-directory: frontend
        run: npm run build

      - name: EC2 임시 배치 디렉터리 초기화
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            rm -rf /home/ubuntu/frontend-build
            mkdir -p /home/ubuntu/frontend-build

      - name: 프론트엔드 빌드 결과 EC2로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/frontend-build"
          strip_components: 2
          overwrite: true

      - name: Nginx 정적 파일 배치
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /var/www/paper-scholar
            sudo rm -rf /var/www/paper-scholar/*
            sudo cp -r /home/ubuntu/frontend-build/* /var/www/paper-scholar/
            sudo chown -R www-data:www-data /var/www/paper-scholar || true
            echo "=== 프론트엔드 배포 완료 ==="

  deploy-backend:
    name: 백엔드 배포
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: EC2에서 백엔드 컨테이너 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e
            cd /home/ubuntu/Paper_Scholar

            DEPLOY_SHA="${{ github.sha }}"

            echo "[1/5] 배포 대상 커밋 동기화: $DEPLOY_SHA"
            git fetch --all --prune
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"

            echo "[2/5] 새 Docker 이미지 빌드 (기존 서비스 유지)..."
            sudo docker build -t lizcha01/paper-scholar:latest .

            echo "[3/5] 백엔드 컨테이너 교체..."
            sudo docker stop paper-scholar 2>/dev/null || true
            sudo docker rm paper-scholar 2>/dev/null || true

            DB_PORT_VAL="${{ secrets.DB_PORT }}"
            DB_PORT_VAL="${DB_PORT_VAL:-33062}"

            sudo docker run -d \
              --name paper-scholar \
              -p 8000:8000 \
              --dns 8.8.8.8 \
              --dns 8.8.4.4 \
              --restart always \
              -e DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="$DB_PORT_VAL" \
              -e RUNPOD_API_URL="https://llm.skn33-project.store" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e OPENAI_CHAT_MODEL="${{ secrets.OPENAI_CHAT_MODEL }}" \
              -e NVIDIA_API_KEY="${{ secrets.NVIDIA_API_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
              -e LANGSMITH_PROJECT="${{ secrets.LANGSMITH_PROJECT }}" \
              -e LANGSMITH_TRACING="${{ secrets.LANGSMITH_TRACING }}" \
              lizcha01/paper-scholar:latest

            echo "[4/5] DB 마이그레이션 적용..."
            sleep 3
            sudo docker exec paper-scholar python manage.py migrate --noinput || true

            echo "[5/5] 7일 이상 된 댕글링 이미지 정리..."
            sudo docker image prune -f --filter "until=168h"

            echo "=== 백엔드 배포 완료 ==="

  deployment-summary:
    name: 배포 결과 요약
    if: always()
    needs: [detect-changes, deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Job summary 작성
        env:
          FRONTEND_SELECTED: ${{ needs.detect-changes.outputs.frontend }}
          BACKEND_SELECTED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
          BACKEND_RESULT: ${{ needs.deploy-backend.result }}
        run: |
          {
            echo "## 배포 결과"
            echo
            echo "| 영역 | 선택됨 | 결과 |"
            echo "|---|---:|---|"
            echo "| 프론트엔드 | $FRONTEND_SELECTED | $FRONTEND_RESULT |"
            echo "| 백엔드 | $BACKEND_SELECTED | $BACKEND_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
