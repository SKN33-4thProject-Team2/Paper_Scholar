name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 의존성 캐시
        id: frontend-deps
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: 프론트엔드 의존성 설치 (lock이 바뀐 경우에만)
        if: steps.frontend-deps.outputs.cache-hit != 'true'
        run: cd frontend && npm ci

      - name: 프론트엔드 빌드
        run: cd frontend && npm run build

      - name: 프론트엔드 빌드 결과 EC2로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/frontend-build"
          strip_components: 2
          overwrite: true

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e
            cd /home/ubuntu/Paper_Scholar

            echo "[1/5] 원격 소스 코드 최신화..."
            git fetch --all
            git reset --hard origin/main

            echo "[2/5] 새 Docker 이미지 빌드 (기존 서비스 무중단 유지)..."
            # 기존 서버가 도는 상태에서 새 이미지를 먼저 빌드
            sudo docker build -t lizcha01/paper-scholar:latest .

            echo "[3/5] 컨테이너 즉시 교체 (다운타임 1~2초)..."
            sudo docker stop paper-scholar 2>/dev/null || true
            sudo docker rm paper-scholar 2>/dev/null || true

            # 포트 번호 기본값 안전 처리
            DB_PORT_VAL="${{ secrets.DB_PORT }}"
            DB_PORT_VAL="${DB_PORT_VAL:-33062}"

            sudo docker run -d \
              --name paper-scholar \
              -p 8000:8000 \
              --dns 8.8.8.8 \
              --dns 8.8.4.4 \
              --restart always \
              -e DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="$DB_PORT_VAL" \
              -e RUNPOD_API_URL="https://llm.skn33-project.store" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e OPENAI_CHAT_MODEL="${{ secrets.OPENAI_CHAT_MODEL }}" \
              -e NVIDIA_API_KEY="${{ secrets.NVIDIA_API_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
              -e LANGSMITH_PROJECT="${{ secrets.LANGSMITH_PROJECT }}" \
              -e LANGSMITH_TRACING="${{ secrets.LANGSMITH_TRACING }}" \
              lizcha01/paper-scholar:latest

            echo "[4/5] DB 마이그레이션 적용..."
            sleep 3
            sudo docker exec paper-scholar python manage.py migrate --noinput || true

            echo "[5/6] 오래된 댕글링 이미지만 정리 (빌드 캐시 보존)..."
            # 주의: 조건 없는 prune은 직전 빌드의 중간 레이어까지 지워
            # 다음 배포에서 torch/requirements를 처음부터 다시 받게 만든다.
            # 방금 만든 캐시는 남기고 일주일 지난 것만 정리한다.
            sudo docker image prune -f --filter "until=168h"

            echo "[6/6] 프론트엔드 정적 파일 배치..."
            # nginx가 /var/www/paper-scholar 를 서빙하도록 설정돼 있어야 반영된다.
            # (nginx/app.conf 참고 — 서버 설정은 수동으로 한 번만 맞추면 된다)
            sudo mkdir -p /var/www/paper-scholar
            sudo rm -rf /var/www/paper-scholar/*
            sudo cp -r /home/ubuntu/frontend-build/* /var/www/paper-scholar/
            sudo chown -R www-data:www-data /var/www/paper-scholar || true

            echo "=== 증분 배포 완료 ==="