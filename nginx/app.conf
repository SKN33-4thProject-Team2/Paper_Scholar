# 주의: 이 파일은 배포 파이프라인이 자동으로 적용하지 않습니다.
# 현재 EC2에 올라가 있는 설정과 다를 수 있으니, 서버에 반영할 때는
# 기존 /etc/nginx/sites-enabled/ 설정을 먼저 확인하고 수동으로 교체하세요.
#   sudo cp nginx/app.conf /etc/nginx/sites-available/paper-scholar
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name skn33-project.store;

    # React 빌드 산출물을 nginx가 직접 서빙한다.
    # SPA라 /library, /search, /papers/2005.11401 같은 주소로 직접 들어와도
    # 해당 경로의 파일을 찾지 못하면 index.html을 돌려줘야 한다.
    root /var/www/paper-scholar;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 정적 자산은 길게 캐시한다.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django REST API 리버스 프록시 (포트 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Supervisor 실행은 검색·요약·번역까지 이어져 오래 걸릴 수 있다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
